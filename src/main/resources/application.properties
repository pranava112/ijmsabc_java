# =========================================
# = SERVER CONFIGURATION
# =========================================
# Uses SERVER_PORT from .env if available, otherwise 8080
server.port=${SERVER_PORT:8080}


# =========================================
# = DATABASE CONFIGURATION (MySQL - Local)
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/ijmsabc_db
spring.datasource.username=root
spring.datasource.password=Munna
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

localhost:3306

# =========================================
# = JPA / HIBERNATE CONFIGURATION
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


# =========================================
# = FILE UPLOAD CONFIGURATION
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# =========================================
# = LOGGING CONFIGURATION
# =========================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.ijmsabc_backend=DEBUG


# =========================================
# = EMAIL CONFIGURATION (Gmail SMTP)
# =========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ijmsbc@gmail.com
spring.mail.password=gaewasbsyvsjvljz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8


# =========================================
# = DOTENV SUPPORT
# =========================================
spring.config.import=optional:file:.env
