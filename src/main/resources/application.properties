# =========================================
# = SERVER CONFIGURATION
# =========================================
# Uses SERVER_PORT from .env if available, otherwise 8080
server.port=8080


# =========================================
# = DATABASE CONFIGURATION (MySQL - VPS Localhost)
# =========================================
# Connect to MySQL running on the same VPS server
spring.datasource.url=jdbc:mysql://localhost:3306/ijmsabc_db
spring.datasource.username=ijmsabc_user
spring.datasource.password=Ijmsabc@2026#Strong
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# = JPA / HIBERNATE CONFIGURATION
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


# =========================================
# = FILE UPLOAD CONFIGURATION
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# =========================================
# = LOGGING CONFIGURATION
# =========================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.ijmsabc_backend=DEBUG


